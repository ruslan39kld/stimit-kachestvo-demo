        var heroIntervalId = null;
        var scoreAnimFrameId = null;

        function clearAllTimeouts() {
          for (var i = 0; i < timeouts.length; i++) {
            window.clearTimeout(timeouts[i]);
          }
          timeouts = [];
        }

        function stopHeroTimer() {
          if (heroIntervalId !== null) {
            window.clearInterval(heroIntervalId);
            heroIntervalId = null;
          }
        }

        function stopScoreAnim() {
          if (scoreAnimFrameId !== null) {
            window.cancelAnimationFrame(scoreAnimFrameId);
            scoreAnimFrameId = null;
          }
        }

        function escapeHtml(str) {
          if (str === null || str === undefined) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function getActiveScenario() {
          for (var i = 0; i < SCENARIOS.length; i++) {
            if (SCENARIOS[i].id === state.activeScenarioId) return SCENARIOS[i];
          }
          return SCENARIOS[0];
        }

        function prefersReducedMotion() {
          return window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        // =========================================================================
        // 4. КОМПОНЕНТЫ РЕНДЕРИНГА
        // =========================================================================

        function renderPipelineHtml(nodeStates, animateSignals, compact) {
          var itemsHtml = AGENT_ROLES.map(function (agent, index) {
            var nodeState = nodeStates[agent.id] || 'idle';
            var isLast = index === AGENT_ROLES.length - 1;
            var nextState = !isLast ? nodeStates[AGENT_ROLES[index + 1].id] : 'idle';
            var connectorActive =
              nodeState === 'completed' ||
              (nodeState === 'active' && nextState === 'active');

            var circleSize = compact ? 'w-7 h-7 text-xs' : 'w-8 h-8 text-xs';
            var circleStyle =
              nodeState === 'completed'
                ? 'bg-emerald-500 border-emerald-400 text-white shadow-sm shadow-emerald-950/30'
                : nodeState === 'active'
                  ? 'bg-sky-400 border-sky-200 text-slate-950 shadow-md shadow-sky-900/40'
                  : 'bg-white/10 border-white/20 text-white/75';

            var labelSize = compact ? 'text-xs sm:text-[13px]' : 'text-xs sm:text-sm';
            var labelColor =
              nodeState === 'active'
                ? 'text-white font-semibold'
                : nodeState === 'completed'
                  ? 'text-emerald-200'
                  : 'text-white/75';

            var pulseRing =
              nodeState === 'active'
                ? '<span aria-hidden="true" class="absolute inset-0 rounded-full bg-sky-300/40 animate-node-ring"></span>'
                : '';

            var innerIcon =
              nodeState === 'completed'
                ? ICONS.check('w-4 h-4')
                : '<span>' + (index + 1) + '</span>';

            var connectorHtml = '';
            if (!isLast) {
              var lineColor = connectorActive ? 'bg-sky-300/60' : 'bg-white/15';
              var signalDot =
                animateSignals && (nodeState === 'active' || connectorActive)
                  ? '<div class="absolute inset-0 flex items-center">' +
                      '<div class="w-full relative h-2">' +
                        '<span class="absolute top-1/2 -translate-y-1/2 left-0 w-2 h-2 rounded-full bg-sky-200 shadow-[0_0_8px_rgba(186,230,253,0.9)] animate-signal-travel" style="animation-delay:' +
                          (index * 0.28).toFixed(2) +
                        's"></span>' +
                      '</div>' +
                    '</div>'
                  : '';

              connectorHtml =
                '<div class="hidden sm:flex items-center flex-1 mx-2 md:mx-3 relative h-4 overflow-hidden" aria-hidden="true">' +
                  '<div class="w-full h-[2px] rounded-full transition-colors duration-300 ' + lineColor + '"></div>' +
                  signalDot +
                '</div>';
            }

            return (
              '<div class="flex items-center ' + (isLast ? 'shrink-0' : 'flex-1 min-w-0') + '">' +
                '<div class="flex items-center gap-2 shrink-0">' +
                  '<div class="relative flex items-center justify-center">' +
                    pulseRing +
                    '<div class="relative z-10 flex items-center justify-center rounded-full border transition-colors duration-200 ' + circleSize + ' font-mono font-semibold tabular-nums ' + circleStyle + '">' +
                      innerIcon +
                    '</div>' +
                  '</div>' +
                  '<div class="flex flex-col">' +
                    '<span class="whitespace-nowrap font-medium leading-tight transition-colors duration-200 ' + labelSize + ' ' + labelColor + '">' +
                      escapeHtml(agent.shortName) +
                    '</span>' +
                  '</div>' +
                '</div>' +
                connectorHtml +
              '</div>'
            );
          }).join('');

          return (
            '<div class="w-full" aria-label="Схема конвейера из 5 AI-агентов">' +
              '<div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-2 sm:gap-1">' +
                itemsHtml +
              '</div>' +
            '</div>'
          );
        }

        function renderRatingIndicator(rating) {
          if (rating === 'хорошо') {
            return (
              '<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 whitespace-nowrap shrink-0">' +
                ICONS.checkCircle('w-4 h-4 text-emerald-600') +
                '<span>хорошо</span>' +
              '</span>'
            );
          }
          if (rating === 'средне') {
            return (
              '<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-amber-700 whitespace-nowrap shrink-0">' +
                ICONS.alertTriangle('w-4 h-4 text-amber-600') +
                '<span>средне</span>' +
              '</span>'
            );
          }
          return (
            '<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-red-700 whitespace-nowrap shrink-0">' +
              ICONS.xCircle('w-4 h-4 text-red-600') +
              '<span>плохо</span>' +
            '</span>'
          );
        }

        function getVerdictTheme(verdict) {
          if (verdict === 'хорошо') {
            return {
              text: 'text-emerald-700',
              surface: 'bg-emerald-50 border-emerald-200',
              scoreColor: 'text-emerald-700',
              icon: ICONS.checkCircle('w-7 h-7 text-emerald-700')
            };
          }
          if (verdict === 'средне') {
            return {
              text: 'text-amber-700',
              surface: 'bg-amber-50 border-amber-200',
              scoreColor: 'text-amber-700',
              icon: ICONS.alertTriangle('w-7 h-7 text-amber-700')
            };
          }
          return {
            text: 'text-red-700',
            surface: 'bg-red-50 border-red-200',
            scoreColor: 'text-red-700',
            icon: ICONS.xCircle('w-7 h-7 text-red-700')
          };
        }

        // --- Главный экран ---

        function getHeroNodeStates() {
          var map = {};
          for (var i = 0; i < STAGE_ORDER.length; i++) {
            var stage = STAGE_ORDER[i];
            if (i < state.heroActiveIndex) map[stage] = 'completed';
            else if (i === state.heroActiveIndex) map[stage] = 'active';
            else map[stage] = 'idle';
          }
          return map;
        }

        function renderHeroPipelineInner() {
          var activeAgent = AGENT_ROLES[state.heroActiveIndex];
          return (

            '</div>' +

        function renderHomeView() {

                  '<div class="flex items-center gap-2 text-xs font-medium text-slate-500">' +

                '<div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between gap-4">' +

                    '<span>Пройти сценарий</span>' +

              '</article>'
            );
          }).join('');

          return (
            '<div class="min-h-screen flex flex-col">' +
              '<section class="bg-gradient-to-br from-[#1B3A6B] via-[#152E56] to-[#0D1E3B] text-white">' +

                  '<header class="flex items-center justify-between gap-8 pb-8 border-b border-white/[0.12]">' +
                    '<a href="#top" data-action="prevent-top" class="text-lg font-extrabold tracking-tight text-white whitespace-nowrap shrink-0">STIMIT</a>' +
                    '<nav class="hidden md:flex items-center gap-6 text-sm font-medium text-white/80">' +
                      '<a href="#scenarios" class="hover:text-white transition-colors whitespace-nowrap shrink-0">Сценарии</a>' +
                      '<button type="button" data-action="open-methodology" class="hover:text-white transition-colors whitespace-nowrap shrink-0 cursor-pointer">6 критериев</button>' +
                      '<button type="button" data-action="open-methodology" class="hover:text-white transition-colors whitespace-nowrap shrink-0 cursor-pointer">Исходный промт</button>' +
                    '</nav>' +
                    '<div class="flex items-center shrink-0">' +
                      '<button type="button" data-action="open-methodology" class="px-4 py-2 text-xs sm:text-sm font-medium text-white/95 bg-white/10 hover:bg-white/[0.18] border border-white/20 rounded-lg transition-colors whitespace-nowrap shrink-0 cursor-pointer">О системе</button>' +
                    '</div>' +
                  '</header>' +

                  '<div class="mt-8 sm:mt-10 max-w-4xl">' +
                    '<h1 class="text-3xl sm:text-4xl lg:text-[44px] font-extrabold tracking-tight leading-[1.15] text-white">' +
                      'Поддержка решает проблему — или отписывается?' +
                    '</h1>' +
                    '<p class="mt-4 text-base sm:text-lg text-slate-200/90 leading-relaxed max-w-3xl">' +
                      'Вы — клиент доставки еды с проблемой. Оператор отвечает, а пять AI-агентов разбирают его работу по шести критериям и выносят честный вердикт.' +
                    '</p>' +
                  '</div>' +

                  '<div id="hero-pipeline-box" class="mt-8 p-4 sm:p-5 rounded-xl bg-white/[0.06] border border-white/[0.12]">' +
                    renderHeroPipelineInner() +
                  '</div>' +

                  '<div class="mt-8">' +
                    '<button type="button" data-action="start-scenario" data-scenario-id="' + escapeHtml(featuredScenario.id) + '" class="inline-flex items-center justify-center gap-2.5 px-7 py-3.5 text-base font-bold text-slate-950 bg-white hover:bg-sky-50 rounded-xl shadow-lg shadow-slate-950/25 transition-all duration-150 hover:-translate-y-0.5 cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300">' +
                      '<span>Смотреть пример</span>' +
                      ICONS.arrowRight('w-5 h-5') +
                    '</button>' +
                  '</div>' +
                '</div>' +
              '</section>' +

              '<main id="scenarios" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">' +
                '<div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 mb-6">' +
                  '<div>' +
                    '<h2 class="text-xl font-bold text-slate-900">Сценарии проверки</h2>' +
                    '<p class="text-sm text-slate-600 mt-1">Сравните, как система выявляет отписки и строгие нарушения регламента</p>' +
                  '</div>' +
                '</div>' +
                '<div class="grid grid-cols-1 md:grid-cols-3 gap-6">' +
                  cardsHtml +
                '</div>' +
              '</main>' +

              '<footer class="border-t border-slate-200 bg-white/70">' +
                '<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">' +
                  '<span>AI-контроль качества поддержки · автономный интерактивный демо-стенд</span>' +
                  '<button type="button" data-action="open-methodology" class="text-[#1B3A6B] hover:underline font-medium cursor-pointer">Правила оценки и исходный промт</button>' +
                '</div>' +
              '</footer>' +
            '</div>'
          );

        // --- Экран диалога ---

        function getDialoguePipelineNodeStates() {
          if (!state.pipelineStage) {
            return {
              analyst: 'active',
              evaluator: state.observations.length > 0 ? 'active' : 'idle',
              critic: 'idle',
              calibrator: 'idle',
              finalizer: 'idle'
            };
          }
          var activeIdx = STAGE_ORDER.indexOf(state.pipelineStage);
          var map = {};
          for (var i = 0; i < STAGE_ORDER.length; i++) {
            var id = STAGE_ORDER[i];
            if (i < activeIdx) map[id] = 'completed';
            else if (i === activeIdx) map[id] = 'active';
            else map[id] = 'idle';
          }
          return map;
        }

        function renderChatMessagesHtml(scenario) {
          var currentStep = scenario.steps[state.currentStepIndex];
          var isFinished = state.pipelineStage !== null;

          if (state.messages.length === 0 && !state.isOperatorTyping) {
            return (
              '<div class="py-10 text-center text-sm text-slate-400">' +
                'Выберите первую реплику клиента ниже, чтобы начать диалог с оператором' +
              '</div>'
            );
          }

          var html = state.messages.map(function (msg) {
            if (msg.sender === 'demo-notice') {
              var examplesHtml = '';
              if (msg.showExampleButtons && currentStep && !isFinished) {
                var btns = currentStep.options.map(function (opt) {
                  return (
                    '<button type="button" data-action="select-option" data-option-id="' + escapeHtml(opt.id) + '" ' +
                      (state.isOperatorTyping ? 'disabled ' : '') +
                      'class="text-left px-3 py-1.5 text-xs font-medium text-[#1B3A6B] bg-white hover:bg-[#1B3A6B]/[0.08] border border-slate-200 rounded-lg transition-colors cursor-pointer disabled:opacity-50">' +
                      escapeHtml(opt.text) +
                    '</button>'
                  );
                }).join('');

                examplesHtml =
                  '<div class="mt-3 flex flex-col gap-2">' +
                    '<span class="text-xs text-slate-500">Примеры реплик для этого шага:</span>' +
                    '<div class="flex flex-wrap gap-2">' + btns + '</div>' +
                  '</div>';

              return (
                '<div class="animate-msg-in bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs sm:text-sm text-slate-700">' +
                  '<p class="font-semibold text-slate-900">' + escapeHtml(msg.text) + '</p>' +
                  examplesHtml +
                '</div>'
              );

            var isClient = msg.sender === 'client';
            return (
              '<div class="animate-msg-in flex flex-col ' + (isClient ? 'items-end' : 'items-start') + '">' +
                '<span class="text-[11px] font-medium text-slate-400 mb-1 px-1">' +
                  (isClient ? 'Вы (клиент)' : 'Оператор поддержки') +
                '</span>' +
                '<div class="max-w-[85%] px-4 py-2.5 rounded-xl text-sm leading-relaxed ' +
                  (isClient
                    ? 'bg-[#1B3A6B] text-white rounded-br-sm'
                    : 'bg-slate-100 text-slate-800 rounded-bl-sm') +
                '">' +
                  escapeHtml(msg.text) +
                '</div>' +
              '</div>'
            );
          }).join('');

          if (state.isOperatorTyping) {
            html +=
              '<div class="flex flex-col items-start">' +
                '<span class="text-[11px] font-medium text-slate-400 mb-1 px-1">Оператор поддержки</span>' +
                '<div class="px-4 py-2.5 rounded-xl rounded-bl-sm bg-slate-100 text-slate-500 text-sm inline-flex items-center gap-2">' +
                  '<span>печатает…</span>' +
                '</div>' +
              '</div>';
          }

          return html;
        }

        function renderReplyOptionsHtml(scenario) {
          var currentStep = scenario.steps[state.currentStepIndex];
          if (!currentStep || state.pipelineStage !== null) return '';

          var activeStepNumber = Math.min(state.currentStepIndex + 1, scenario.stepsCount);

          var buttonsHtml = currentStep.options.map(function (option) {
            var alreadyTried = state.triedAltIds.indexOf(option.id) !== -1;
            var btnClass = alreadyTried
              ? 'bg-slate-100/80 border-slate-200 text-slate-500'
              : 'bg-white border-slate-200 text-slate-800 hover:border-[#1B3A6B] hover:bg-[#1B3A6B]/[0.03] shadow-sm';
            var trailing = alreadyTried
              ? '<span class="inline-flex items-center gap-1 text-xs text-slate-400 shrink-0 whitespace-nowrap">' +
                  ICONS.check('w-3.5 h-3.5') +
                  '<span>спросили</span>' +
                '</span>'
              : ICONS.arrowRight('w-4 h-4 text-slate-400 shrink-0');

            return (
              '<button type="button" data-action="select-option" data-option-id="' + escapeHtml(option.id) + '" ' +
                (state.isOperatorTyping ? 'disabled ' : '') +
                'class="w-full text-left px-4 py-3 rounded-xl border text-sm transition-all duration-150 flex items-center justify-between gap-3 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed ' + btnClass + '">' +
                '<span class="leading-snug">' + escapeHtml(option.text) + '</span>' +
                trailing +
              '</button>'
            );
          }).join('');

          return (
            '<div class="flex items-center justify-between gap-2">' +
              '<span class="text-xs font-semibold text-slate-600">' +

            '</div>' +
            '<div class="flex flex-col gap-2">' + buttonsHtml + '</div>'
          );
        }

          var latestObservation =
            state.observations.length > 0
              ? state.observations[state.observations.length - 1]
              : null;

          var obsBoxHtml = latestObservation
            ? '<div>' +
                '<div class="text-[11px] font-mono tabular-nums font-semibold text-[#1B3A6B]">' +
                  'Шаг ' + latestObservation.stepNumber + ' · Последнее наблюдение' +

            '<div class="space-y-3">' +
              '<div class="flex items-center justify-between">' +
                '<h3 class="text-sm font-bold text-slate-900">' + escapeHtml(AGENT_ROLES[0].name) + '</h3>' +

            '<div class="space-y-2.5">' +
              '<div class="flex items-center justify-between">' +
                '<h3 class="text-sm font-bold text-slate-900">' + escapeHtml(AGENT_ROLES[1].name) + '</h3>' +

                      '<p class="text-slate-600 text-xs sm:text-sm mt-0.5">' + escapeHtml(item.reason) + '</p>' +

            : '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">' +
              EVALUATION_CRITERIA.map(function (criterion, idx) {
                return (

                    '<span class="text-slate-700 font-medium text-xs sm:text-sm">' + (idx + 1) + '. ' + escapeHtml(criterion) + '</span>' +
                    '<span class="text-xs text-slate-400 shrink-0">ожидание</span>' +

          var criticSection = isCompleted

                  '<li class="flex items-start gap-3 px-4 py-3 rounded-lg bg-slate-50 border border-slate-200">' +

            : '<p class="text-slate-600 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg px-4 py-3">' +

            return (

                '<span>' + escapeHtml(rule) + '</span>' +

            );
          }).join('');

          return (
            '<div data-action="close-modal-backdrop" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 backdrop-blur-[2px] p-4" role="dialog" aria-modal="true" aria-labelledby="agent-details-title">' +
              '<div data-modal-dialog="true" class="bg-white border border-slate-200 rounded-xl shadow-2xl w-full max-w-3xl max-h-[88vh] flex flex-col overflow-hidden">' +
                '<div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-slate-200 bg-slate-50/70">' +
                  '<div>' +
                    '<h2 id="agent-details-title" class="text-lg font-bold text-slate-900">Подробнее: как думали агенты</h2>' +
                    '<p class="text-xs text-slate-500 mt-0.5 tabular-nums">' +
                      'Сценарий ' + scenario.number + ' · ' + escapeHtml(scenario.title) + ' · ' +
                      (isCompleted
                        ? 'полный конвейер завершён'
                        : 'шаг ' + Math.min(state.currentStepIndex + 1, scenario.stepsCount) + ' из ' + scenario.stepsCount) +
                    '</p>' +
                  '</div>' +
                  '<button type="button" data-action="close-details" aria-label="Закрыть подробности" class="p-2 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-200/70 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
                    ICONS.x('w-5 h-5') +
                  '</button>' +
                '</div>' +

                '<div class="overflow-y-auto px-6 py-5 space-y-6 text-sm text-slate-700">' +
                  '<section>' +
                    '<h3 class="text-base font-bold text-slate-900 mb-3">Наблюдения Оценщика по шагам диалога</h3>' +
                    obsSection +
                  '</section>' +
                  '<hr class="border-slate-200" />' +
                  '<section>' +
                    '<div class="flex items-baseline justify-between gap-2 mb-3">' +
                      '<h3 class="text-base font-bold text-slate-900">Оценка по 6 критериям</h3>' +
                      (!isCompleted ? '<span class="text-xs text-slate-500">Итоговые оценки выставятся после шага 5</span>' : '') +
                    '</div>' +
                    criteriaSection +
                  '</section>' +
                  '<hr class="border-slate-200" />' +
                  '<section>' +
                    '<h3 class="text-base font-bold text-slate-900 mb-3">Разбор Агента-Критика</h3>' +
                    criticSection +
                  '</section>' +
                  '<hr class="border-slate-200" />' +
                  '<section>' +
                    '<h3 class="text-base font-bold text-slate-900 mb-2.5">Правила Калибратора</h3>' +
                    '<ul class="space-y-1.5 text-xs sm:text-sm text-slate-600">' + rulesHtml + '</ul>' +
                  '</section>' +
                '</div>' +

                '<div class="px-6 py-3.5 border-t border-slate-200 bg-slate-50/70 flex justify-end">' +
                  '<button type="button" data-action="close-details" class="px-5 py-2 text-sm font-semibold text-white bg-[#1B3A6B] hover:bg-[#142D54] rounded-lg transition-colors whitespace-nowrap">Закрыть</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }

        function renderMethodologyModalHtml() {
          if (!state.isMethodologyOpen) return '';

          var agentsHtml = AGENT_ROLES.map(function (agent, idx) {
            return (
              '<div class="px-4 py-3 flex items-start gap-3">' +
                '<span class="font-mono tabular-nums text-xs font-semibold text-[#1B3A6B] bg-[#1B3A6B]/[0.08] px-2 py-0.5 rounded mt-0.5 shrink-0">0' + (idx + 1) + '</span>' +
                '<div>' +
                  '<div class="font-semibold text-slate-900">' + escapeHtml(agent.name) + '</div>' +
                  '<div class="text-slate-600 text-xs sm:text-sm mt-0.5">' + escapeHtml(agent.role) + '</div>' +
                '</div>' +
              '</div>'
            );
          }).join('');

          var criteriaHtml = EVALUATION_CRITERIA.map(function (criterion, idx) {
            return (
              '<li class="flex items-baseline gap-2.5">' +
                '<span class="font-mono tabular-nums text-xs font-semibold text-slate-400">' + (idx + 1) + '.</span>' +
                '<span>' + escapeHtml(criterion) + '</span>' +
              '</li>'
            );
          }).join('');

          var rulesHtml = EVALUATION_RULES.map(function (rule) {
            return (
              '<li class="flex items-start gap-2">' +
                '<span class="text-[#1B3A6B] font-bold">—</span>' +
                '<span>' + escapeHtml(rule) + '</span>' +
              '</li>'
            );
          }).join('');

          return (
            '<div data-action="close-modal-backdrop" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 backdrop-blur-[2px] p-4" role="dialog" aria-modal="true" aria-labelledby="methodology-modal-title">' +
              '<div data-modal-dialog="true" class="bg-white border border-slate-200 rounded-xl shadow-2xl w-full max-w-3xl max-h-[88vh] flex flex-col overflow-hidden">' +
                '<div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-slate-200 bg-slate-50/70">' +
                  '<div>' +
                    '<h2 id="methodology-modal-title" class="text-lg font-bold text-slate-900">Методика оценки и архитектура системы</h2>' +
                    '<p class="text-xs text-slate-500 mt-0.5">6 фиксированных критериев, правила калибровки и исходный промт агентной системы</p>' +
                  '</div>' +
                  '<button type="button" data-action="close-methodology" aria-label="Закрыть окно" class="p-2 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-200/70 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
                    ICONS.x('w-5 h-5') +
                  '</button>' +
                '</div>' +

                '<div class="overflow-y-auto px-6 py-5 space-y-6 text-sm text-slate-700 leading-relaxed">' +
                  '<section>' +
                    '<h3 class="text-base font-bold text-slate-900 mb-2">О проекте</h3>' +
                    '<p class="text-slate-600">' + escapeHtml(PROJECT_DESCRIPTION_BLOCK_B) + '</p>' +
                  '</section>' +
                  '<hr class="border-slate-200" />' +
                  '<section>' +
                    '<h3 class="text-base font-bold text-slate-900 mb-3">Конвейер из 5 AI-агентов</h3>' +
                    '<div class="divide-y divide-slate-100 border border-slate-200 rounded-lg">' + agentsHtml + '</div>' +
                  '</section>' +
                  '<hr class="border-slate-200" />' +
                  '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">' +
                    '<section>' +
                      '<h3 class="text-base font-bold text-slate-900 mb-2.5">6 критериев оценки</h3>' +
                      '<ol class="space-y-1.5 text-slate-700">' + criteriaHtml + '</ol>' +
                    '</section>' +
                    '<section>' +
                      '<h3 class="text-base font-bold text-slate-900 mb-2.5">Строгие правила калибровки</h3>' +
                      '<ul class="space-y-2 text-xs sm:text-sm text-slate-600">' + rulesHtml + '</ul>' +
                    '</section>' +
                  '</div>' +
                  '<hr class="border-slate-200" />' +
                  '<section>' +
                    '<h3 class="text-base font-bold text-slate-900 mb-2">Исходный промт агентной системы (источник прототипа)</h3>' +
                    '<pre class="whitespace-pre-wrap font-sans text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg p-4 leading-relaxed">' +
                      escapeHtml(ORIGINAL_PROMPT_BLOCK_A) +
                    '</pre>' +
                  '</section>' +
                '</div>' +

                '<div class="px-6 py-3.5 border-t border-slate-200 bg-slate-50/70 flex justify-end">' +
                  '<button type="button" data-action="close-methodology" class="px-5 py-2 text-sm font-semibold text-white bg-[#1B3A6B] hover:bg-[#142D54] rounded-lg transition-colors whitespace-nowrap">Понятно</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }

        // =========================================================================
        // 5. УПРАВЛЕНИЕ РЕНДЕРОМ И ТОЧЕЧНЫМИ ОБНОВЛЕНИЯМИ DOM
        // =========================================================================

        var appEl = document.getElementById('app');

        function renderModalsOnly() {
          var modalRoot = document.getElementById('modal-root');
          if (!modalRoot) return;
          modalRoot.innerHTML =
            renderDetailsModalHtml() + renderMethodologyModalHtml();
        }

        function renderFullApp() {
          stopHeroTimer();
          stopScoreAnim();

          var viewHtml = '';
          if (state.view === 'home') viewHtml = renderHomeView();
          else if (state.view === 'dialogue') viewHtml = renderDialogueView();
          else viewHtml = renderResultView();

          appEl.innerHTML =
            '<div id="top" class="min-h-screen bg-[#F4F6FA] text-slate-900">' +
              viewHtml +
              '<div id="modal-root"></div>' +
            '</div>';

          renderModalsOnly();

          if (state.view === 'home' && !prefersReducedMotion()) {
            heroIntervalId = window.setInterval(function () {
              state.heroActiveIndex = (state.heroActiveIndex + 1) % STAGE_ORDER.length;
              var box = document.getElementById('hero-pipeline-box');
              if (box) {
                box.innerHTML = renderHeroPipelineInner();
              }
            }, 2000);
          }

          if (state.view === 'dialogue') {
            bindCustomInputEvents();
          }

          if (state.view === 'result') {
            startScoreCounterAnimation();
          }
        }

        function startScoreCounterAnimation() {
          var targetScore = getActiveScenario().finalAnalysis.score;
          var scoreEl = document.getElementById('result-score-value');
          if (!scoreEl) return;

          if (prefersReducedMotion()) {
            scoreEl.textContent = String(targetScore);
            return;
          }

          var duration = 900;
          var start = performance.now();

          function tick(now) {
            var progress = Math.min((now - start) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3);
            var el = document.getElementById('result-score-value');
            if (el) {
              el.textContent = String(Math.round(eased * targetScore));
            }
            if (progress < 1) {
              scoreAnimFrameId = window.requestAnimationFrame(tick);
            }
          }

          scoreAnimFrameId = window.requestAnimationFrame(tick);
        }

        function updateDialogueParts() {
          if (state.view !== 'dialogue') return;
          var scenario = getActiveScenario();
          var activeStepNumber = Math.min(state.currentStepIndex + 1, scenario.stepsCount);
          var isFinished = state.pipelineStage !== null;

          var stepEl = document.getElementById('dialogue-step-counter');
          if (stepEl) {
            stepEl.textContent = 'Шаг ' + activeStepNumber + ' из ' + scenario.stepsCount;
          }

          var pipeBox = document.getElementById('dialogue-pipeline-box');
          if (pipeBox) {
            pipeBox.innerHTML = renderPipelineHtml(
              getDialoguePipelineNodeStates(),
              true,
              true
            );
          }

          var bannerSlot = document.getElementById('pipeline-banner-slot');
          if (bannerSlot) {
            bannerSlot.innerHTML = renderPipelineBannerHtml();
          }

          var helperEl = document.getElementById('helper-bubble');
          if (helperEl) {
            if (!state.hasInteracted && !isFinished) {
              helperEl.className =
                'mx-5 mt-4 px-4 py-3 rounded-xl bg-sky-50 border border-sky-200 text-xs sm:text-sm text-[#1B3A6B] font-medium';
              helperEl.textContent =
                'Вы отвечаете за клиента — выбирайте реплики и смотрите, как агенты оценивают оператора';
            } else {
              helperEl.className = '';
              helperEl.textContent = '';
            }
          }

          var chatFeed = document.getElementById('chat-feed');
          if (chatFeed) {
            chatFeed.innerHTML =
              renderChatMessagesHtml(scenario) + '<div id="chat-end"></div>';
            var chatEnd = document.getElementById('chat-end');
            if (chatEnd && chatEnd.scrollIntoView) {
              chatEnd.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
          }

          var replyControls = document.getElementById('reply-controls-container');
          if (replyControls) {
            if (isFinished) {
              replyControls.classList.add('hidden');
            } else {
              replyControls.classList.remove('hidden');
            }
          }

          var replySlot = document.getElementById('reply-options-slot');
          if (replySlot) {
            replySlot.innerHTML = renderReplyOptionsHtml(scenario);
          }

          var inputEl = document.getElementById('custom-input-field');
          var submitBtn = document.getElementById('custom-input-submit');
          if (inputEl && submitBtn) {
            inputEl.disabled = state.isOperatorTyping;
            submitBtn.disabled = !inputEl.value.trim() || state.isOperatorTyping;
          }

          var agentPanel = document.getElementById('agent-panel-column');
          if (agentPanel) {
            agentPanel.innerHTML = renderAgentPanelHtml();
          }

          updateMobileTabsUI();
        }

        function updateMobileTabsUI() {
          var tabsBar = document.getElementById('mobile-tabs-bar');
          var dialogueCol = document.getElementById('dialogue-column');
          var agentCol = document.getElementById('agent-panel-column');
          if (!tabsBar || !dialogueCol || !agentCol) return;

          var dlgBtn = tabsBar.querySelector('[data-tab="dialogue"]');
          var agBtn = tabsBar.querySelector('[data-tab="agents"]');
          if (dlgBtn && agBtn) {
            dlgBtn.className =
              'px-3 py-2 text-xs sm:text-sm font-semibold rounded-md transition-colors cursor-pointer whitespace-nowrap ' +
              (state.mobileTab === 'dialogue'
                ? 'bg-white text-slate-900 shadow-sm'
                : 'text-slate-600 hover:text-slate-900');

            agBtn.className =
              'px-3 py-2 text-xs sm:text-sm font-semibold rounded-md transition-colors cursor-pointer whitespace-nowrap tabular-nums ' +
              (state.mobileTab === 'agents'
                ? 'bg-white text-slate-900 shadow-sm'
                : 'text-slate-600 hover:text-slate-900');
            agBtn.textContent =
              'Агенты' + (state.observations.length > 0 ? ' (' + state.observations.length + ')' : '');
          }

          if (state.mobileTab === 'dialogue') {
            dialogueCol.classList.remove('hidden', 'lg:flex');
            dialogueCol.classList.add('flex');
            agentCol.classList.remove('block');
            agentCol.classList.add('hidden', 'lg:block');
          } else {
            dialogueCol.classList.remove('flex');
            dialogueCol.classList.add('hidden', 'lg:flex');
            agentCol.classList.remove('hidden', 'lg:block');
            agentCol.classList.add('block');
          }
        }

        function bindCustomInputEvents() {
          var form = document.getElementById('custom-input-form');
          var input = document.getElementById('custom-input-field');
          var submit = document.getElementById('custom-input-submit');
          if (!form || !input || !submit) return;

          input.addEventListener('input', function () {
            submit.disabled = !input.value.trim() || state.isOperatorTyping;
          });

          form.addEventListener('submit', function (e) {
            e.preventDefault();
            var trimmed = input.value.trim();
            if (!trimmed || state.isOperatorTyping || state.pipelineStage !== null) {
              return;
            }
            state.hasInteracted = true;
            state.messages.push({
              id: 'client-custom-' + Date.now(),
              sender: 'client',
              text: trimmed
            });
            state.messages.push({
              id: 'demo-notice-' + Date.now(),
              sender: 'demo-notice',
              text: 'Это демо-стенд, показан сценарий работы системы.',
              showExampleButtons: true
            });
            input.value = '';
            updateDialogueParts();
          });
        }

        // =========================================================================
        // 6. ИГРОВАЯ ЛОГИКА СЦЕНАРИЕВ И ДЕЙСТВИЯ ПОЛЬЗОВАТЕЛЯ
        // =========================================================================

        function startScenario(scenarioId) {
          clearAllTimeouts();
          state.activeScenarioId = scenarioId;
          state.currentStepIndex = 0;
          state.messages = [];
          state.triedAltIds = [];
          state.isOperatorTyping = false;
          state.analystState = null;
          state.observations = [];
          state.changedFields = {
            problem: false,
            request: false,
            status: false,
            observation: false
          };
          state.mobileTab = 'dialogue';
          state.pipelineStage = null;
          state.showTranscript = false;
          state.view = 'dialogue';
          renderFullApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
          clearAllTimeouts();
          state.view = 'home';
          state.pipelineStage = null;
          renderFullApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToResult() {
          clearAllTimeouts();
          state.pipelineStage = null;
          state.showTranscript = false;
          state.view = 'result';
          renderFullApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function triggerFieldHighlights(prevAnalyst, nextAnalyst, hasNewObs) {
          state.changedFields = {
            problem: !prevAnalyst || prevAnalyst.problem !== nextAnalyst.problem,
            request: !prevAnalyst || prevAnalyst.request !== nextAnalyst.request,
            status: !prevAnalyst || prevAnalyst.status !== nextAnalyst.status,
            observation: hasNewObs
          };

          var t = window.setTimeout(function () {
            state.changedFields = {
              problem: false,
              request: false,
              status: false,
              observation: false
            };
            var agentPanel = document.getElementById('agent-panel-column');
            if (agentPanel && state.view === 'dialogue') {
              agentPanel.innerHTML = renderAgentPanelHtml();
            }
          }, 1600);
          timeouts.push(t);
        }

        function runFullPipeline() {
          var stepDelay = prefersReducedMotion() ? 150 : 720;
          state.pipelineStage = 'evaluator';
          updateDialogueParts();

          timeouts.push(
            window.setTimeout(function () {
              state.pipelineStage = 'critic';
              updateDialogueParts();
            }, stepDelay)
          );
          timeouts.push(
            window.setTimeout(function () {
              state.pipelineStage = 'calibrator';
              updateDialogueParts();
            }, stepDelay * 2)
          );
          timeouts.push(
            window.setTimeout(function () {
              state.pipelineStage = 'finalizer';
              updateDialogueParts();
            }, stepDelay * 3)
          );
          timeouts.push(
            window.setTimeout(function () {
              goToResult();
            }, stepDelay * 4)
          );
        }

        function selectOption(optionId) {
          var scenario = getActiveScenario();
          var currentStep = scenario.steps[state.currentStepIndex];
          if (!currentStep || state.isOperatorTyping || state.pipelineStage !== null) {
            return;
          }

          var option = null;
          for (var i = 0; i < currentStep.options.length; i++) {
            if (currentStep.options[i].id === optionId) {
              option = currentStep.options[i];
              break;
            }
          }
          if (!option) return;

          state.hasInteracted = true;
          state.messages.push({
            id: 'client-' + Date.now() + '-' + option.id,
            sender: 'client',
            text: option.text
          });
          state.isOperatorTyping = true;
          updateDialogueParts();

          if (!option.isMain) {
            if (state.triedAltIds.indexOf(option.id) === -1) {
              state.triedAltIds.push(option.id);
            }
            timeouts.push(
              window.setTimeout(function () {
                state.isOperatorTyping = false;
                state.messages.push({
                  id: 'op-alt-' + Date.now() + '-' + option.id,
                  sender: 'operator',
                  text:
                    option.altOperatorReply ||
                    'Понимаю. Уточните детали, пожалуйста.'
                });
                updateDialogueParts();
              }, 620)
            );
            return;
          }

          var stepSnapshot = currentStep;
          var stepIdx = state.currentStepIndex;

          timeouts.push(
            window.setTimeout(function () {
              state.isOperatorTyping = false;
              state.messages.push({
                id: 'op-main-' + Date.now() + '-' + stepSnapshot.stepNumber,
                sender: 'operator',
                text: stepSnapshot.mainOperatorReply
              });

              var prevAnalyst = state.analystState;
              var nextAnalyst = stepSnapshot.analyst;
              state.analystState = nextAnalyst;

              var hasNewObs = Boolean(stepSnapshot.evaluatorObservation);
              if (hasNewObs) {
                state.observations.push({
                  stepNumber: stepSnapshot.stepNumber,
                  observation: stepSnapshot.evaluatorObservation
                });
              }

              triggerFieldHighlights(prevAnalyst, nextAnalyst, hasNewObs);

              if (stepIdx < scenario.steps.length - 1) {
                state.currentStepIndex = stepIdx + 1;
                state.triedAltIds = [];
                updateDialogueParts();
              } else {
                runFullPipeline();
              }
            }, 680)
          );
        }

        // Делегирование кликов и клавиш
        document.addEventListener('click', function (e) {
          var target = e.target.closest('[data-action]');
          if (!target) return;

          var action = target.getAttribute('data-action');

          if (action === 'prevent-top') {
            e.preventDefault();
          } else if (action === 'start-scenario') {
            startScenario(target.getAttribute('data-scenario-id'));
          } else if (action === 'restart-scenario') {
            startScenario(state.activeScenarioId);
          } else if (action === 'back-home') {
            goHome();
          } else if (action === 'select-option') {
            selectOption(target.getAttribute('data-option-id'));
          } else if (action === 'set-mobile-tab') {
            state.mobileTab = target.getAttribute('data-tab');
            updateMobileTabsUI();
          } else if (action === 'skip-pipeline') {
            goToResult();
          } else if (action === 'toggle-transcript') {
            state.showTranscript = !state.showTranscript;
            var transcriptSlot = document.getElementById('result-transcript-slot');
            var iconSlot = document.getElementById('toggle-transcript-icon');
            if (transcriptSlot) {
              if (state.showTranscript) {
                var msgs = state.messages.map(function (msg) {
                  var isClient = msg.sender === 'client';
                  return (
                    '<div class="flex ' + (isClient ? 'justify-end' : 'justify-start') + '">' +
                      '<div class="max-w-xl px-3.5 py-2 rounded-lg text-xs sm:text-sm ' +
                        (isClient ? 'bg-[#1B3A6B] text-white' : 'bg-slate-100 text-slate-800') + '">' +
                        '<span class="font-semibold mr-1.5">' + (isClient ? 'Клиент:' : 'Оператор:') + '</span>' +
                        '<span>' + escapeHtml(msg.text) + '</span>' +
                      '</div>' +
                    '</div>'
                  );
                }).join('');
                transcriptSlot.innerHTML =
                  '<div class="mt-5 pt-5 border-t border-slate-200">' +
                    '<h2 class="text-sm font-bold text-slate-900 mb-3">Запись переписки</h2>' +
                    '<div class="space-y-2.5 max-h-72 overflow-y-auto pr-1">' + msgs + '</div>' +
                  '</div>';
              } else {
                transcriptSlot.innerHTML = '';
              }
            }
            if (iconSlot) {
              iconSlot.innerHTML = state.showTranscript
                ? ICONS.chevronUp('w-4 h-4')
                : ICONS.chevronDown('w-4 h-4');
            }
          } else if (action === 'open-details') {
            state.isDetailsOpen = true;
            renderModalsOnly();
          } else if (action === 'close-details') {
            state.isDetailsOpen = false;
            renderModalsOnly();
          } else if (action === 'open-methodology') {
            state.isMethodologyOpen = true;
            renderModalsOnly();
          } else if (action === 'close-methodology') {
            state.isMethodologyOpen = false;
            renderModalsOnly();
          } else if (action === 'close-modal-backdrop') {
            if (!e.target.closest('[data-modal-dialog="true"]')) {
              state.isDetailsOpen = false;
              state.isMethodologyOpen = false;
              renderModalsOnly();
            }
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && (state.isDetailsOpen || state.isMethodologyOpen)) {
            state.isDetailsOpen = false;
            state.isMethodologyOpen = false;
            renderModalsOnly();
          }
        });

        // Инициализация
        renderFullApp();
      })();
    </script>
  </body>
</html>
